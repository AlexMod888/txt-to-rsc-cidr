name: Build MikroTik rsc
on:
  schedule:
    - cron: "0 0 * * *"   # раз в день в 00:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate rsc
        run: bash generate.sh
        
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gpt-list.rsc
          git diff --staged --quiet || git commit -m "Update gpt-list.rsc"
          git push
